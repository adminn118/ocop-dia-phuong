<!DOCTYPE html>
<html>
<head>
    <title>Đặt hàng OCOP</title>
    <link rel="stylesheet" href="styles.css">
    <script>
        function thongBao() { alert("Cảm ơn bạn! Đơn hàng đã được ghi nhận (Mô phỏng)."); }
    </script>
</head>
<body>
    <header><h1>ĐẶT HÀNG TRỰC TUYẾN</h1></header>
    <div class="container">
        <form onsubmit="thongBao(); return false;" style="max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 8px;">
            <label>Họ và tên:</label><br>
            <input type="text" required style="width: 100%; margin-bottom: 15px;"><br>
            
            <label>Số điện thoại:</label><br>
            <input type="tel" required style="width: 100%; margin-bottom: 15px;"><br>
            
            <label>Sản phẩm:</label><br>
            <select style="width: 100%; margin-bottom: 15px;">
                <option>Khoai deo Lệ Thủy</option>
                <option>Rượu Tuy Lộc</option>
                <option>Nón Quy Hậu</option>
            </select><br>
            
            <label>Số lượng:</label><br>
            <input type="number" min="1" value="1" style="width: 100%; margin-bottom: 15px;"><br>
            
            <button type="submit" class="btn" style="width: 100%; border: none; cursor: pointer;">Gửi đơn hàng</button>
        </form>
        <p style="text-align: center;"><a href="index.html">Quay lại trang chủ</a></p>
    </div>
</body>
</html>
